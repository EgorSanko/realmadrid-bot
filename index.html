<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Real Madrid Fan Bot</title>

    <!-- Preload critical resources -->
    <link rel="preconnect" href="https://images.fotmob.com">
    <link rel="icon" href="/static/rm-logo.png" />
    <link rel="preload" as="style" href="/static/tailwind.css" />
    <link rel="preload" as="script" href="/static/react.min.js" />
    <link rel="preload" as="script" href="/static/react-dom.min.js" />

    <!-- Telegram Web App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- React -->
    <script src="/static/react.min.js" defer></script>
    <script src="/static/react-dom.min.js" defer></script>

    <!-- Tailwind CSS (prebuilt) -->
    <link rel="stylesheet" href="/static/tailwind.css" />

    <!-- HLS.js для IPTV стримов -->
    <script src="/static/hls.min.js" defer></script>
    <link rel="stylesheet" href="/static/plyr.css" />
    <script src="/static/plyr.js" defer></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        /* Hide number input spinners */
        input[type=number]::-webkit-inner-spin-button,
        input[type=number]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
        }

        /* Plyr overrides */
        :root {
            --plyr-color-main: #d4a017;
            --plyr-video-background: #000;
            --plyr-badge-background: #d4a017;
            --plyr-badge-text-color: #000;
            --plyr-range-fill-background: #d4a017;
        }
        .plyr--video {
            border-radius: 12px;
            overflow: hidden;
        }
        .plyr--fullscreen {
            border-radius: 0;
        }
        .plyr__poster {
            background-size: cover;
        }
        .live-badge-overlay {
            position: absolute;
            top: 12px;
            left: 12px;
            z-index: 20;
            background: #e53e3e;
            color: #fff;
            font-size: 11px;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 6px;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 5px;
            pointer-events: none;
        }
        .live-badge-overlay::before {
            content: '';
            width: 7px;
            height: 7px;
            background: #fff;
            border-radius: 50%;
            animation: livePulse 1.2s ease-in-out infinite;
        }
        @keyframes livePulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        /* Fullscreen fallback for Telegram WebApp */
        .plyr-fullscreen-fallback {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            z-index: 99999 !important;
            background: #000 !important;
            border-radius: 0 !important;
        }
        #player-overlay:fullscreen,
        #player-overlay:-webkit-full-screen {
            width: 100vw;
            height: 100vh;
            background: #000;
        }
        #player-overlay:fullscreen video,
        #player-overlay:-webkit-full-screen video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        #player-overlay:fullscreen .plyr,
        #player-overlay:-webkit-full-screen .plyr {
            width: 100%;
            height: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: #0A0A0C;
            color: white;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Background image */
        .bg-pattern {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background:
                linear-gradient(180deg, rgba(10,10,12,0.92) 0%, rgba(10,10,12,0.85) 50%, rgba(10,10,12,0.92) 100%),
                url('bg.jpg') center/cover no-repeat;
            z-index: -1;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 3px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #FEBE10; border-radius: 3px; }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(100%); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        @keyframes glow {
            0%, 100% { box-shadow: 0 0 5px rgba(254,190,16,0.3); }
            50% { box-shadow: 0 0 20px rgba(254,190,16,0.6); }
        }

        @keyframes loading {
            0% { width: 10%; }
            50% { width: 70%; }
            100% { width: 10%; }
        }

        .animate-fade { animation: fadeIn 0.4s ease-out; }
        .animate-slide { animation: slideUp 0.3s ease-out; }
        .animate-pulse-slow { animation: pulse 2s ease-in-out infinite; }
        .animate-glow { animation: glow 2s ease-in-out infinite; }
        .animate-loading { animation: loading 1.5s ease-in-out infinite; }

        /* Quiz anti-copy protection */
        .quiz-protected {
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            -webkit-touch-callout: none;
        }

        .skeleton {
            background: linear-gradient(90deg, #1E1E24 25%, #2A2A32 50%, #1E1E24 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }

        /* Glass effect */
        .glass {
            background: rgba(20, 20, 24, 0.92);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Smooth page transitions */
        .page-transition { transition: opacity 0.2s ease, transform 0.2s ease; }

        /* Better image loading */
        img { transition: opacity 0.3s; }
        img[loading="lazy"] { opacity: 1; }

        /* Tabular numbers for scores */
        .tabular-nums { font-variant-numeric: tabular-nums; }

        /* Hide scrollbar */
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }

        /* Gold button */
        .btn-gold {
            background: linear-gradient(135deg, #FEBE10 0%, #E5AB0E 50%, #FEBE10 100%);
            color: #000;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.2s;
        }
        .btn-gold:hover { transform: translateY(-1px); box-shadow: 0 4px 15px rgba(254,190,16,0.4); }
        .btn-gold:active { transform: scale(0.98); }

        /* Tabs */
        .tab-active {
            color: #FEBE10;
            position: relative;
        }
        .tab-active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 20px;
            height: 3px;
            background: #FEBE10;
            border-radius: 3px;
        }

        /* Navigation */
        .nav-item {
            transition: all 0.2s;
        }
        .nav-item.active {
            color: #FEBE10;
        }
        .nav-item.active .nav-icon {
            transform: scale(1.1);
        }
        .nav-indicator {
            position: absolute;
            top: -2px;
            width: 4px;
            height: 4px;
            background: #FEBE10;
            border-radius: 50%;
            left: 50%;
            transform: translateX(-50%);
        }

        /* Cards */
        .match-card {
            position: relative;
            overflow: hidden;
        }
        .match-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, transparent, #FEBE10, transparent);
            opacity: 0.5;
        }

        /* Odds buttons */
        .odds-btn {
            background: rgba(30, 30, 36, 0.9);
            border: 1px solid rgba(255,255,255,0.1);
            transition: all 0.2s;
        }
        .odds-btn:hover {
            background: #FEBE10;
            color: #000;
            border-color: #FEBE10;
            transform: translateY(-2px);
        }
        .odds-btn:active {
            transform: scale(0.95);
        }

        /* Status badges */
        .badge-pending { background: rgba(234,179,8,0.15); color: #EAB308; }
        .badge-won { background: rgba(34,197,94,0.15); color: #22C55E; }
        .badge-lost { background: rgba(239,68,68,0.15); color: #EF4444; }
        .badge-sold { background: rgba(59,130,246,0.15); color: #3B82F6; }

        /* Hide scrollbar for nav */
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body>
    <div class="bg-pattern"></div>
    <div id="root"></div>

    <script src="/static/app.js?v=1778595097" defer></script>
    <script src="/static/match-videos-overlay.js?v=30" defer></script>
</body>
</html>
