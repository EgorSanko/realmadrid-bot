name: rm-v2

# Один образ, два контейнера. Общий том ./data (= /opt/rm-v2/data) с SQLite-снимками:
# collector пишет, api только читает.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  api:
    build:
      context: ./backend
      args:
        GIT_SHA: ${GIT_SHA:-unknown}   # deploy.sh подставляет git rev-parse --short HEAD
    image: rm-v2-api:latest
    container_name: rm-v2-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8010:8000"
    mem_limit: 256m
    # секреты админки и бота (ADMIN_TOKEN, BOT_TOKEN, ADMIN_IDS, BOT_USERNAME, необязательный SESSION_SECRET —
    # ключ сессий входа; без него ключ выводится из BOT_TOKEN) — только на сервере в /opt/rm-v2/.env,
    # в git их нет; без файла админка и вход закрыты
    env_file:
      - path: .env
        required: false
    environment:
      - TZ=UTC
      - DATA_DIR=/data
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *logging

  collector:
    image: rm-v2-api:latest
    container_name: rm-v2-collector
    depends_on:
      - api
    restart: unless-stopped
    command: ["python", "-m", "app.collector"]
    # SOCKS-туннель к SofaScore слушает 127.0.0.1:1080 хоста — из bridge-сети его не видно,
    # поэтому сборщик живёт в сети хоста (портов не открывает). API остаётся в bridge.
    network_mode: host
    mem_limit: 256m
    # BOT_TOKEN — бот входа по коду: long polling getUpdates через туннель (app/bot.py).
    # Без токена приём апдейтов выключен; выключить на ходу — DISABLED_SOURCES=telegram_bot
    # или строка telegram_bot в data/disabled_sources.
    env_file:
      - path: .env
        required: false
    environment:
      - TZ=UTC
      - DATA_DIR=/data
      - SOFA_PROXY=socks5h://127.0.0.1:1080
      # аватары пользователей с t.me — через тот же туннель
      - TG_PROXY=socks5h://127.0.0.1:1080
      - DISABLED_SOURCES=${DISABLED_SOURCES:-}
      - DEBUG_LIVE_MATCH=${DEBUG_LIVE_MATCH:-}
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import time,sys; sys.exit(0 if time.time() - float(open('/data/collector.heartbeat').read()) < 120 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    logging: *logging

  # пока идёт эфир — пишет его в data/rec (последние 10 мин, без звука), на каждый гол — 2-минутный mp4
  # в data/clips (+ .json: кто, минута, счёт). Ручной ролик: docker exec rm-v2-recorder python -m app.recorder clip
  recorder:
    build:
      context: ./backend
      dockerfile: Dockerfile.recorder
    image: rm-v2-recorder:latest
    container_name: rm-v2-recorder
    restart: unless-stopped
    mem_limit: 192m
    environment:
      - TZ=UTC
      - DATA_DIR=/data
    volumes:
      - ./data:/data
    logging: *logging
